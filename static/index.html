<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Учебная база «Контора»</title>
    <!-- Стили определяют внешний вид формы, кнопок и таблицы. -->
    <style>
      body {
        font:
          16px/1.5 Arial,
          sans-serif;
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px;
        color: #263648;
        background: #f5f7f9;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 4px;
      }
      h2 {
        font-size: 21px;
        margin: 0 0 14px;
      }
      p {
        margin: 8px 0 16px;
      }
      .panel {
        background: white;
        border: 1px solid #d9e1e8;
        border-radius: 8px;
        padding: 20px;
        margin: 18px 0;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        font: inherit;
        border: 1px solid #aab9c7;
        background: white;
        border-radius: 5px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:hover {
        background: #edf3f8;
      }
      button.active,
      .primary {
        background: #295d86;
        color: white;
        border-color: #295d86;
      }
      button.danger {
        color: #a12424;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
      }
      input,
      select {
        font: inherit;
        padding: 8px;
        border: 1px solid #aebbc8;
        border-radius: 4px;
        min-width: 0;
      }
      input:focus,
      select:focus {
        outline: 2px solid #79a5c9;
      }
      #actions {
        display: flex;
        gap: 8px;
        margin-top: 15px;
      }
      .status {
        min-height: 24px;
        color: #a12424;
      }
      .status.ok {
        color: #28643a;
      }
      .scroll {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        border: 1px solid #d5dee6;
        padding: 8px;
        vertical-align: top;
        white-space: nowrap;
      }
      th {
        background: #eef3f7;
      }
      td button {
        font-size: 13px;
        padding: 5px 8px;
        margin-right: 4px;
      }
      small {
        color: #5a6d7d;
      }
      /* Уменьшаем отступы на узких экранах. */
      @media (max-width: 600px) {
        body {
          margin: 15px auto;
        }
        .panel {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Учебная база «Контора»</h1>
    <p>Выберите таблицу, чтобы посмотреть и изменить её записи.</p>
    <!-- Кнопки разделов создаёт JavaScript по описанию, полученному от сервера. -->
    <nav id="navigation" aria-label="Таблицы базы"></nav>
    <section class="panel">
      <h2 id="form-title">Новая запись</h2>
      <!-- Поля формы создаются динамически для выбранной таблицы. -->
      <form id="record-form">
        <div id="fields" class="form-grid"></div>
        <div id="actions">
          <button class="primary" type="submit">Добавить</button
          ><button id="cancel" type="button" hidden>Отмена</button>
        </div>
      </form>
      <!-- Здесь появляются сообщения об успешном действии или ошибке. -->
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <small
        >Поля со звёздочкой обязательны. Связанные записи выбираются из
        существующих таблиц.</small
      >
    </section>
    <section class="panel">
      <h2 id="table-title">Записи</h2>
      <!-- В этот контейнер JavaScript помещает таблицу с записями. -->
      <div id="results" class="scroll"></div>
    </section>
    <!-- Подключаем код интерфейса; defer запускает его после разбора HTML. -->
    <script src="app.js" defer></script>
  </body>
</html>
